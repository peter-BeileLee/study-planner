            mono: ['JetBrains Mono', 'monospace'],

    // 2. 月度计划表数据
    // 格式: 'YYYY-MM-DD': [ { task: '任务描述', status: 'done' | 'urgent' | 'normal' } ]
    const MONTHLY_SCHEDULE_DATA = {
      "2026-09-01": [
        { task: "学期目标拆解与 Milestone 设定", status: "urgent" },
        { task: "核心教辅与历年真题分类入档", status: "normal" }
      ],
      "2026-09-05": [
        { task: "纯数重点板块第 1 轮公式闭卷推演", status: "done" }
      ],

      ],

        { task: "跨学科计算机基础模块专题攻坚", status: "normal" }
      ],

        { task: "月度学业进度大复盘与试卷归档", status: "urgent" }
      ]
    };

    // 当前月历游标（默认显示当前年月）
    let currentYear = 2026;
    let currentMonth = 8; // 0 代表 1月，8 代表 9月

    // 标签样式映射
    const TAG_STYLES = {
      focus: "bg-indigo-950/40 text-indigo-300 border-indigo-800/60 hover:bg-indigo-900/40",
      test: "bg-cyan-950/40 text-cyan-300 border-cyan-800/60 hover:bg-cyan-900/40",
      rest: "bg-emerald-950/30 text-emerald-300 border-emerald-900/50 hover:bg-emerald-900/30",
      review: "bg-amber-950/30 text-amber-300 border-amber-900/50 hover:bg-amber-900/30",
      default: "bg-night-850 text-slate-300 border-night-800 hover:bg-night-800"
    };

    // 视图切换
    function switchView(view) {
      const tabW = document.getElementById('tabWeekly');
      const tabM = document.getElementById('tabMonthly');
      const viewW = document.getElementById('viewWeekly');
      const viewM = document.getElementById('viewMonthly');

      if (view === 'weekly') {
        viewW.classList.remove('hidden');
        viewM.classList.add('hidden');
        tabW.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30";
        tabM.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 text-slate-400 hover:text-slate-200";
      } else {
        viewW.classList.add('hidden');
        viewM.classList.remove('hidden');
        tabM.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30";
        tabW.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 text-slate-400 hover:text-slate-200";
        renderMonthlyCalendar();
      }
    }

    // 渲染周计划表
    function renderWeeklyGrid() {
      const container = document.getElementById('weeklyGridContainer');
      let html = '';

      for (const [timeSlot, days] of Object.entries(WEEKLY_SCHEDULE_DATA)) {
        html += `
          <div class="grid grid-cols-8 text-xs font-mono min-h-[46px] items-stretch">
            <div class="p-2.5 border-r border-night-800 bg-night-850/50 flex items-center justify-center font-bold text-slate-400">
              ${timeSlot}
            </div>
        `;

        days.forEach((item, index) => {
          const style = TAG_STYLES[item.tag] || TAG_STYLES.default;
          html += `
            <div class="p-1.5 border-r border-night-800 last:border-r-0 flex flex-col justify-center">
              <div class="h-full w-full rounded border px-2 py-1.5 text-[11px] leading-tight flex items-center transition-colors duration-150 ${style}">
                ${item.text}
              </div>
            </div>
          `;
        });

        html += `</div>`;
      }
      container.innerHTML = html;
    }

    // 月历左右切换
    function prevMonth() {
      currentMonth--;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      renderMonthlyCalendar();
    }

    function nextMonth() {
      currentMonth++;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      renderMonthlyCalendar();
    }

    // 渲染月度计划表
    function renderMonthlyCalendar() {
      const label = document.getElementById('currentMonthLabel');
      const grid = document.getElementById('monthlyCalendarGrid');
      
      const monthNames = ["01 月 (JAN)", "02 月 (FEB)", "03 月 (MAR)", "04 月 (APR)", "05 月 (MAY)", "06 月 (JUN)", "07 月 (JUL)", "08 月 (AUG)", "09 月 (SEP)", "10 月 (OCT)", "11 月 (NOV)", "12 月 (DEC)"];
      label.innerText = `${currentYear} 年 ${monthNames[currentMonth]}`;

      // 获取当月天数与当月 1 号是周几
      const firstDay = new Date(currentYear, currentMonth, 1);
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      
      // 0 是周日，需要转换为周一作为起始 (周一为 0, 周日为 6)
      let startingDay = firstDay.getDay() - 1;
      if (startingDay === -1) startingDay = 6;

      let html = '';

      // 填充上月占位空白格
      for (let i = 0; i < startingDay; i++) {
        html += `<div class="min-h-[110px] bg-night-950/40 p-2 text-slate-700 font-mono text-xs select-none"></div>`;
      }

      // 渲染当月每日格子
      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayTasks = MONTHLY_SCHEDULE_DATA[dateKey] || [];
        const isToday = (new Date().toDateString() === new Date(currentYear, currentMonth, day).toDateString());

        html += `
          <div class="min-h-[110px] p-2 bg-night-900/60 hover:bg-night-850/50 transition-colors flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-1.5">
                <span class="font-mono text-xs font-semibold ${isToday ? 'bg-cyan-500 text-night-950 px-1.5 py-0.5 rounded-full font-bold' : 'text-slate-400'}">
                  ${String(day).padStart(2, '0')}
                </span>
                ${dayTasks.length > 0 ? `<span class="text-[10px] text-cyan-400 font-mono">${dayTasks.length} 任务</span>` : ''}
              </div>
              <div class="space-y-1">
                ${dayTasks.map(t => {
                  let badge = 'border-slate-700 bg-night-800 text-slate-300';
                  if (t.status === 'urgent') badge = 'border-rose-800/60 bg-rose-950/30 text-rose-300';
                  if (t.status === 'done') badge = 'border-emerald-800/60 bg-emerald-950/30 text-emerald-400 line-through opacity-70';
                  return `<div class="text-[11px] p-1 rounded border leading-tight ${badge}">${t.task}</div>`;
                }).join('')}
              </div>
            </div>
            <div class="text-right text-[10px] text-slate-700 font-mono select-none">${dateKey.substring(5)}</div>
          </div>
        `;
      }

      // 补齐末尾单元格
      const totalCells = startingDay + daysInMonth;
      const trailingCells = (7 - (totalCells % 7)) % 7;
      for (let i = 0; i < trailingCells; i++) {
        html += `<div class="min-h-[110px] bg-night-950/40 p-2 text-slate-700 font-mono text-xs select-none"></div>`;
      }

      grid.innerHTML = html;
    }

    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', () => {
      renderWeeklyGrid();
    });
  </script>
</body>
</html>
